<!doctype html>
<html><head><meta charset="utf-8"><title>ClipRally Outro — One Clip. Everywhere.</title>
<style>
  :root{--bg:#101011;--red:#f13549;--red2:#bb1b30;--cyan:#35c8e8;--text:#f5f3ee}
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:absolute;left:0;top:0;overflow:hidden;background:var(--bg)}
  #bg{position:absolute;inset:0}
  canvas{position:absolute;left:0;top:0}
  .persp{position:absolute;inset:0;perspective:1150px;perspective-origin:50% 50%}
  .world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
  .shard{position:absolute;left:0;top:0;background-repeat:no-repeat;will-change:transform}
  .card{position:absolute;left:0;top:0;border-radius:14px;overflow:hidden;background:#000 center/cover;
        box-shadow:0 0 0 2px rgba(255,255,255,.16),0 18px 40px rgba(0,0,0,.55);will-change:transform,opacity;backface-visibility:visible}
  .card .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--red)}
  .card .bar2{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.25)}
  .card .badge{position:absolute;left:9px;top:9px;font:800 15px/1 Inter;color:#fff;padding:5px 8px;border-radius:6px;background:rgba(0,0,0,.6);letter-spacing:.02em}
  .card .badge.live{background:var(--red)}
  .wm{position:absolute;left:0;top:0;white-space:nowrap;font:800 var(--fs)/1 Inter,"Segoe UI",Arial,sans-serif;letter-spacing:-0.045em}
  .wm .c{color:#fff}.wm .r{color:var(--red)}
  .sweep{color:transparent!important;-webkit-background-clip:text;background-clip:text;
         background-image:linear-gradient(100deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 58%);background-size:300% 100%}
  .sweep span{color:transparent!important}
  #label{position:absolute;left:50%;white-space:nowrap;transform:translateX(-50%);font:800 var(--ls)/1 Inter,"Segoe UI",Arial,sans-serif;letter-spacing:.1em;color:var(--text);text-shadow:0 2px 16px rgba(0,0,0,.7)}
  #label b{color:var(--red);font-weight:800}
  #label i{font-style:normal;display:inline-block}
  #flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head>
<body>
<div id="stage">
  <div id="bg"></div>
  <canvas id="under"></canvas>
  <div class="persp" id="persp"><div class="world" id="world"></div></div>
  <canvas id="over"></canvas>
  <div class="persp" id="logoPersp"><div class="world" id="logoWorld"></div></div>
  <div id="label"></div>
  <div id="flash"></div>
</div>
<script>
const Q=new URLSearchParams(location.search);
const VERT=Q.get('v')==='1';
const W=VERT?1080:1920, H=VERT?1920:1080;
const FRAME=Q.get('frame')||'sample_frame.png';
// Logo/text sizes keep everything inside the centre 9:16 column on 16:9 (x 656–1264).
const S=VERT?{fs:210,ls:50,logoY:-60,labelGap:120,R:430,cardW:300,cardH:169}
            :{fs:128,ls:33,logoY:-40,labelGap:84,R:560,cardW:290,cardH:163};
const $=id=>document.getElementById(id);
const st=$('stage');st.style.width=W+'px';st.style.height=H+'px';document.body.style.width=W+'px';document.body.style.height=H+'px';
document.documentElement.style.setProperty('--fs',S.fs+'px');document.documentElement.style.setProperty('--ls',S.ls+'px');
for(const c of ['under','over']){$(c).width=W;$(c).height=H;}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k)};
const outCubic=x=>1-Math.pow(1-x,3), outExpo=x=>x>=1?1:1-Math.pow(2,-10*x), inCubic=x=>x*x*x, inOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rng(s){s=s>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const rnd=rng(2026);

// ---------- background ----------
$('bg').style.background=`radial-gradient(ellipse ${W*.5}px ${H*.38}px at 50% 50%, rgba(241,53,73,.16), rgba(0,0,0,0) 70%),
 radial-gradient(ellipse ${W*.8}px ${H*.5}px at 50% 50%, rgba(53,200,232,.05), rgba(0,0,0,0) 70%), #0b0b0c`;

// ---------- shards of the frozen frame (radial crack pattern) ----------
const IC={x:W*.5+(VERT?20:60), y:H*.5-(VERT?60:30)}; // impact point
const SECT=13, RINGS=[0,70,190,380,700,Math.hypot(W,H)];
const ang=[];for(let i=0;i<SECT;i++)ang.push((i+(rnd()-.5)*.6)/SECT*Math.PI*2);
const radJ=RINGS.map((r,j)=>ang.map(()=>r*(j&&j<RINGS.length-1?(.82+rnd()*.36):1)));
const pt=(j,i)=>{const a=ang[i%SECT]+(i>=SECT?Math.PI*2:0), r=radJ[j][i%SECT];return [IC.x+Math.cos(a)*r, IC.y+Math.sin(a)*r]};
const SH=[];
const world=$('world');
for(let j=0;j<RINGS.length-1;j++)for(let i=0;i<SECT;i++){
  let poly;
  if(j===0) poly=[pt(0,i),pt(1,i),pt(1,i+1)];
  else poly=[pt(j,i),pt(j+1,i),pt(j+1,i+1),pt(j,i+1)];
  const cx=poly.reduce((s,p)=>s+p[0],0)/poly.length, cy=poly.reduce((s,p)=>s+p[1],0)/poly.length;
  // each shard is only as large as its own bounding box (full-frame layers exhaust compositor memory)
  const bx0=Math.max(0,Math.floor(Math.min(...poly.map(p=>p[0])))), by0=Math.max(0,Math.floor(Math.min(...poly.map(p=>p[1]))));
  const bx1=Math.min(W,Math.ceil(Math.max(...poly.map(p=>p[0])))), by1=Math.min(H,Math.ceil(Math.max(...poly.map(p=>p[1]))));
  const el=document.createElement('div');el.className='shard';
  Object.assign(el.style,{width:(bx1-bx0)+'px',height:(by1-by0)+'px',backgroundImage:`url("${FRAME}")`,
    backgroundSize:`${W}px ${H}px`,backgroundPosition:`${-bx0}px ${-by0}px`,
    clipPath:`polygon(${poly.map(p=>(p[0]-bx0).toFixed(1)+'px '+(p[1]-by0).toFixed(1)+'px').join(',')})`,
    transformOrigin:`${cx-bx0}px ${cy-by0}px`});
  world.appendChild(el);
  const dx=cx-IC.x, dy=cy-IC.y, d=Math.hypot(dx,dy)||1;
  SH.push({el,poly,cx,cy,bx0,by0,dir:[dx/d,dy/d],dist:d,ring:j,
    rx:(rnd()-.5)*140, ry:(rnd()-.5)*140, rz:(rnd()-.5)*90, vz:120+rnd()*330, sp:(.7+rnd()*.9)});
}

// ---------- video cards (each shard becomes one, plus extra cards deep in the vortex) ----------
const BADGES=['LIVE','▶ 0:14','🔥 2.4M','LIVE','▶ 0:31','💬 18K','▶ 0:09','LIVE','❤ 96K','▶ 1:02'];
const CARDS=[]; const NC=SH.length+30;
for(let k=0;k<NC;k++){
  const el=document.createElement('div');el.className='card';
  const th=k%12; el.style.backgroundImage=`url("thumbs/t${(th*5)%12}.png")`;
  el.style.width=S.cardW+'px';el.style.height=S.cardH+'px';
  const b=BADGES[k%BADGES.length];
  el.innerHTML=`<div class="bar2"></div><div class="bar" style="width:${20+(k*37)%75}%"></div><div class="badge ${b==='LIVE'?'live':''}">${b}</div>`;
  world.appendChild(el);
  const golden=2.39996;
  const isShard=k<SH.length;
  CARDS.push({el,shard:isShard?SH[k]:null,
    th0:k*golden, Rf:.75+rnd()*.5,
    z0:isShard? -900+rnd()*1000 : -4200+rnd()*2600,
    tilt:(rnd()-.5)*30, delay:rnd()*.08});
}

// ---------- logo: official wordmark "Clip"(white) + "Rally"(#f13549), Inter 800, -0.045em ----------
const WM='<span class="c">Clip</span><span class="r">Rally</span>';
const lw=$('logoWorld');
const probe=document.createElement('div');probe.className='wm';probe.innerHTML=WM;probe.style.visibility='hidden';lw.appendChild(probe);
let LW,LH;const SL=[];let sweepEl,finalEl;
function buildLogo(){
  const b=probe.getBoundingClientRect();LW=b.width;LH=b.height;probe.remove();
  const N=22;
  for(let i=0;i<N;i++){
    const d=document.createElement('div');d.className='wm';d.innerHTML=WM;
    const l=i/N*100, r=100-(i+1)/N*100;
    d.style.clipPath=`inset(-20% ${r-0.15}% -20% ${l-0.15}%)`;
    d.style.transformOrigin=`${(l+r===100?50:(l+ (100-r-l)/2))}% 50%`;
    const off=(i+.5)/N-.5;
    SL.push({el:d,off,delay:Math.abs(off)*.22+rnd()*.04,rz:(rnd()-.5)*40,ry:(rnd()-.5)*120});
    lw.appendChild(d);
  }
  finalEl=document.createElement('div');finalEl.className='wm';finalEl.innerHTML=WM;lw.appendChild(finalEl);
  sweepEl=document.createElement('div');sweepEl.className='wm sweep';sweepEl.innerHTML=WM;lw.appendChild(sweepEl);
  const lab=$('label');
  const txt='CLIPPED ON ';const red='CLIPRALLY';
  lab.innerHTML=[...txt].map(c=>`<i>${c===' '?'&nbsp;':c}</i>`).join('')+`<b>${[...red].map(c=>`<i>${c}</i>`).join('')}</b>`;
  lab.style.top=(H/2+S.logoY+LH/2+S.labelGap-S.ls)+'px';
}

// ---------- network nodes for the ripple ("everywhere") ----------
const NODES=[];{const r=rng(77);for(let i=0;i<70;i++){let x,y;do{x=r()*W;y=r()*H}while(Math.abs(x-W/2)<(VERT?420:420)&&Math.abs(y-(H/2+S.logoY+20))<(VERT?260:190));NODES.push({x,y,s:1.5+r()*2.5,ph:r()})}}
const LINKS=[];for(let i=0;i<NODES.length;i++){let best=-1,bd=1e9;for(let j=0;j<NODES.length;j++){if(i===j)continue;const d=Math.hypot(NODES[i].x-NODES[j].x,NODES[i].y-NODES[j].y);if(d<bd){bd=d;best=j}}LINKS.push([i,best])}

// ---------- per-frame ----------
const CR=[]; // crack edge list
for(const s of SH){const p=s.poly;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];const r=Math.min(Math.hypot(a[0]-IC.x,a[1]-IC.y),Math.hypot(b[0]-IC.x,b[1]-IC.y));CR.push([a,b,r])}}
function spin(tau){return 1.1*tau+7.5*Math.pow(tau,3)/(3*1.69)}     // radians, accelerating
function dive(tau){return 260*tau+2600*Math.pow(tau,3)/(3*1.69)}    // px toward camera, accelerating

window.render=function(t){
  const U=$('under').getContext('2d'), O=$('over').getContext('2d');
  U.clearRect(0,0,W,H);O.clearRect(0,0,W,H);
  // camera shake on crack + snap
  let sx=0,sy=0;
  if(t>.1&&t<.3){const k=1-(t-.1)/.2;sx=Math.sin(t*190)*9*k;sy=Math.cos(t*170)*7*k}
  if(t>2.42&&t<2.62){const k=1-(t-2.42)/.2;sx+=Math.sin(t*210)*12*k;sy+=Math.cos(t*230)*9*k}
  $('persp').style.transform=$('logoPersp').style.transform=`translate(${sx}px,${sy}px)`;

  // ===== SCENE 1: freeze → crack → burst =====
  for(const s of SH){
    let z=0,x=0,y=0,rx=0,ry=0,rz=0,op=1;
    if(t>=.30){ // separation then explosive burst toward camera
      const sep=ss(.30,.42,t)*8*(1+s.ring*.4);
      const u=clamp((t-.40-s.ring*.03)/.62); const e=outCubic(u);
      x=s.dir[0]*(sep+e*s.sp*(320+s.dist*.55)); y=s.dir[1]*(sep+e*s.sp*(240+s.dist*.45));
      z=e*s.vz; rx=e*s.rx; ry=e*s.ry; rz=e*s.rz;
      op=1-ss(.52,.80,t);           // shard dissolves into its card
    }
    s.el.style.opacity=op; s.el.style.display=op<=0.001?'none':'block';
    if(op>0) s.el.style.transform=`translate3d(${-W/2+s.bx0+x}px,${-H/2+s.by0+y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
  }
  // crack lines grow out from the impact point 0.10 → 0.34
  if(t>=.1&&t<.42){
    const grow=outExpo(clamp((t-.1)/.24))*Math.hypot(W,H)*.8, fade=1-ss(.30,.40,t);
    O.save();O.translate(sx,sy);O.lineCap='round';
    for(const [a,b,r] of CR){ if(r>grow)continue;
      const al=fade*(1-r/Math.hypot(W,H))*.95;
      O.strokeStyle=`rgba(255,255,255,${al})`;O.lineWidth=2.2;O.shadowColor='rgba(255,255,255,.9)';O.shadowBlur=12;
      O.beginPath();O.moveTo(a[0],a[1]);O.lineTo(b[0],b[1]);O.stroke(); }
    O.shadowBlur=0;
    // impact bloom
    const k=clamp((t-.1)/.25); if(k<1){const g=O.createRadialGradient(IC.x,IC.y,0,IC.x,IC.y,260*(.4+k));g.addColorStop(0,`rgba(255,255,255,${.95*(1-k)})`);g.addColorStop(.4,`rgba(241,53,73,${.4*(1-k)})`);g.addColorStop(1,'rgba(0,0,0,0)');O.fillStyle=g;O.fillRect(0,0,W,H)}
    O.restore();
  }

  // ===== cards: burst (from shards) → vortex → collapse =====
  const tau=clamp(t-1.0,0,1.32);
  const vw=ss(.72,1.25,t);                 // blend from burst path into vortex
  const col=clamp((t-2.18)/.24);           // collapse into the logo
  const colE=inCubic(col);
  for(const c of CARDS){
    const s=c.shard; let bx=0,by=0,bz=-6000,brx=0,bry=0,brz=0,bsc=1,bop=0;
    if(s){
      const u=clamp((t-.40-s.ring*.03)/.62),e=outCubic(u);
      bx=s.cx-W/2+s.dir[0]*e*s.sp*(320+s.dist*.55); by=s.cy-H/2+s.dir[1]*e*s.sp*(240+s.dist*.45);
      bz=e*s.vz; brx=e*s.rx; bry=e*s.ry; brz=e*s.rz;
      bsc=lerp(.35,1,ss(.45,.85,t)); bop=ss(.50,.74,t);
    }
    // vortex: helix around the dive axis, faces tangential, accelerating spin + dive
    const th=c.th0+spin(tau)*(1+.15*Math.sin(c.th0)), R=S.R*c.Rf*(1-.28*ss(1.6,2.3,t));
    const vx=Math.cos(th)*R, vy=Math.sin(th)*R*(VERT?1.35:.78), vz=c.z0+dive(tau);
    const vrz=th*180/Math.PI+90+c.tilt, vry=Math.sin(th)*25;
    let x=lerp(bx,vx,vw), y=lerp(by,vy,vw), z=lerp(bz,vz,vw), rx=lerp(brx,0,vw), ry=lerp(bry,vry,vw), rz=lerp(brz,vrz,vw), sc=bsc;
    let op=s? bop : ss(.95,1.3,t);
    // fade cards that have flown past the camera
    op*=1-ss(820,1050,z);
    // collapse
    if(col>0){x=lerp(x,0,colE);y=lerp(y,S.logoY,colE);z=lerp(z,-500,colE);sc*=lerp(1,.05,colE);op*=1-ss(.75,1,col);}
    c.el.style.display=op<=0.002?'none':'block';
    if(op>0.002){
      c.el.style.opacity=op;
      c.el.style.transform=`translate3d(${x-S.cardW/2}px,${y-S.cardH/2}px,${z}px) rotateZ(${rz}deg) rotateY(${ry}deg) rotateX(${rx}deg) scale(${sc})`;
      const blur=t>1.1?clamp(Math.pow(tau/1.3,2)*7*(z>-600?1:.4),0,7):0; c.el.style.filter=blur>.3?`blur(${blur.toFixed(1)}px)`:'none';
    }
  }
  // tunnel light + speed lines during the dive
  if(t>.8&&t<2.6){
    const k=ss(.8,1.3,t)*(1-ss(2.42,2.55,t)), sp=Math.pow(clamp(tau/1.3),2);
    const cx=W/2,cy=H/2;
    const g=U.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.6);
    g.addColorStop(0,`rgba(255,240,240,${.10*k+.55*k*Math.pow(col,2)})`);g.addColorStop(.12,`rgba(241,53,73,${.22*k})`);g.addColorStop(.5,`rgba(53,200,232,${.05*k})`);g.addColorStop(1,'rgba(0,0,0,0)');
    U.fillStyle=g;U.fillRect(0,0,W,H);
    const r=rng(Math.floor(t*60)*31+7); O.lineCap='round';
    const n=Math.floor(20+70*sp);
    for(let i=0;i<n;i++){const a=r()*Math.PI*2,r0=60+r()*Math.max(W,H)*.5,len=(80+r()*380)*sp+20;
      const al=(.15+.5*r())*k;O.strokeStyle=r()<.65?`rgba(255,255,255,${al})`:`rgba(241,53,73,${al})`;O.lineWidth=1+r()*2.2;
      O.beginPath();O.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);O.lineTo(cx+Math.cos(a)*(r0+len),cy+Math.sin(a)*(r0+len));O.stroke();}
  }

  // ===== SCENE 2 end: snap + logo assembly 2.42 → 2.80, light sweep 2.78 → 3.15 =====
  const T0=2.42;
  $('flash').style.opacity= t>=T0-.02&&t<T0+.12 ? (t<T0+.02? .22*(t-(T0-.02))/.04 : .22*(1-(t-(T0+.02))/.10)) : 0;
  const ly=S.logoY;
  for(const s of SL){
    const k=clamp((t-T0-s.delay)/.32), e=outExpo(k);
    s.el.style.opacity=clamp(k*4)*(t<2.86?1:0);
    s.el.style.transform=`translate3d(${-LW/2+s.off*LW*(1-e)*.6}px,${ly-LH/2}px,${(1-e)*-1400}px) rotateY(${s.ry*(1-e)}deg) rotateZ(${s.rz*(1-e)}deg)`;
    s.el.style.filter=k<1?`blur(${((1-e)*8).toFixed(1)}px)`:'none';
  }
  // settled logo: exact wordmark, gentle breathing scale in scene 3
  const settle=t>=2.86?1:0; const br=t>3?1+.012*Math.sin((t-3)*Math.PI):1;
  const pop=t>=T0+.25&&t<T0+.6?1+.05*Math.sin(clamp((t-T0-.25)/.35)*Math.PI):1;
  finalEl.style.opacity=settle;
  finalEl.style.transform=`translate3d(${-LW/2}px,${ly-LH/2}px,0) scale(${br})`;
  for(const s of SL) if(t>=T0+.25&&t<2.86) s.el.style.transform+=` scale(${pop})`;
  // light sweep across the logo
  const sw=clamp((t-2.80)/.40);
  sweepEl.style.opacity=sw>0&&sw<1?1:0; sweepEl.style.backgroundPosition=`${lerp(110,-10,inOutCubic(sw))}% 0`;
  sweepEl.style.transform=finalEl.style.transform;
  // logo glow
  if(t>=T0){const k=clamp((t-T0)/.15), pulse=t>3?.55+.25*Math.pow(Math.sin((t-3)*Math.PI*.9),2):lerp(1,.6,clamp((t-T0)/.6));
    const cx=W/2,cy=H/2+ly; const g=U.createRadialGradient(cx,cy,0,cx,cy,LW*.95);
    g.addColorStop(0,`rgba(241,53,73,${.42*k*pulse})`);g.addColorStop(.45,`rgba(187,27,48,${.16*k*pulse})`);g.addColorStop(1,'rgba(0,0,0,0)');
    U.save();U.translate(cx,cy);U.scale(1,.5);U.translate(-cx,-cy);U.fillStyle=g;U.fillRect(0,0,W,H*2);U.restore();
    // snap shockwave
    const sk=clamp((t-T0)/.6); if(sk<1){O.strokeStyle=`rgba(255,255,255,${.8*(1-sk)})`;O.lineWidth=5*(1-sk)+1;O.shadowColor='rgba(241,53,73,1)';O.shadowBlur=20;
      O.beginPath();O.ellipse(cx,cy,outExpo(sk)*Math.max(W,H)*.55,outExpo(sk)*Math.max(W,H)*.55*(VERT?.6:.42),0,0,Math.PI*2);O.stroke();O.shadowBlur=0;}
  }

  // ===== SCENE 3: label + ripple across a network =====
  const lab=$('label');const chars=lab.querySelectorAll('i');
  chars.forEach((ch,i)=>{const k=clamp((t-2.98-i*.018)/.22),e=outCubic(k);ch.style.opacity=k;ch.style.transform=`translateY(${(1-e)*26}px)`;ch.style.filter=k<1?`blur(${(1-e)*5}px)`:'none'});
  if(t>=3.15){
    const cx=W/2,cy=H/2+ly;
    const rings=[3.2,3.75,4.3].map(t0=>clamp((t-t0)/1.1));
    for(const k of rings){ if(k<=0||k>=1)continue; const r=outCubic(k)*Math.hypot(W,H)*.62;
      O.strokeStyle=`rgba(241,53,73,${.45*(1-k)})`;O.lineWidth=2;O.beginPath();O.ellipse(cx,cy,r,r*(VERT?1:.62),0,0,Math.PI*2);O.stroke();
      O.strokeStyle=`rgba(255,255,255,${.18*(1-k)})`;O.lineWidth=1;O.beginPath();O.ellipse(cx,cy,r*.985,r*.985*(VERT?1:.62),0,0,Math.PI*2);O.stroke();}
    // nodes light up as a ring passes them, links draw in
    const fadeIn=ss(3.15,3.5,t);
    for(const [a,b] of LINKS){const A=NODES[a],B=NODES[b];O.strokeStyle=`rgba(255,255,255,${.06*fadeIn})`;O.lineWidth=1;O.beginPath();O.moveTo(A.x,A.y);O.lineTo(B.x,B.y);O.stroke();}
    for(const n of NODES){
      const dn=Math.hypot(n.x-cx,(n.y-cy)/(VERT?1:.62)); let hit=0;
      for(const k of rings){if(k<=0)continue;const r=outCubic(k)*Math.hypot(W,H)*.62;const d=Math.abs(r-dn);hit=Math.max(hit,Math.exp(-d/40)*(1-k*.5))}
      const lit=Math.max(hit, dn< (rings[0]>0?outCubic(rings[0])*Math.hypot(W,H)*.62:0) ? .35:0);
      O.fillStyle=`rgba(255,255,255,${(.12+.25*lit)*fadeIn})`;O.beginPath();O.arc(n.x,n.y,n.s,0,Math.PI*2);O.fill();
      if(hit>.05){O.fillStyle=`rgba(241,53,73,${hit*.9})`;O.shadowColor='rgba(241,53,73,1)';O.shadowBlur=14;O.beginPath();O.arc(n.x,n.y,n.s+2.5*hit,0,Math.PI*2);O.fill();O.shadowBlur=0;}
    }
  }
};
document.fonts.ready.then(()=>{buildLogo();
  const imgs=[FRAME,...Array.from({length:12},(_,i)=>`thumbs/t${i}.png`)];
  Promise.all(imgs.map(src=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=src}))).then(()=>{window.render(0);window.READY=true});
});
</script>
