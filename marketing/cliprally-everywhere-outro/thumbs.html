<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#000}
  .t{position:relative;width:480px;height:270px;overflow:hidden;font-family:Inter,"Noto Color Emoji",sans-serif}
  .emo{font-family:"Noto Color Emoji";line-height:1}
  .cam{position:absolute;border-radius:12px;overflow:hidden;border:3px solid rgba(255,255,255,.85)}
  .chat{position:absolute;font:700 15px/1.45 Inter;color:#fff;text-shadow:0 1px 3px #000}
  .big{position:absolute;font:900 64px/1 Inter;color:#fff;letter-spacing:-.02em;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(0,0,0,.4)}
  .person{position:absolute}
</style></head><body>
<div id="root"></div>
<script>
// Each thumb is a stylised still for a kind of moment people clip: reactions, gaming plays, streamer screams, crowds.
function person(x,y,s,skin,shirt,mouth,hair,headset){ // simple illustrated streamer bust
  const m={o:`<ellipse cx="50" cy="66" rx="11" ry="14" fill="#2a0b0b"/><ellipse cx="50" cy="72" rx="7" ry="5" fill="#d9475a"/>`,
           laugh:`<path d="M34 60 Q50 84 66 60 Z" fill="#2a0b0b"/><path d="M38 61 L62 61 L60 65 L40 65Z" fill="#fff"/>`,
           grin:`<path d="M36 62 Q50 74 64 62" stroke="#2a0b0b" stroke-width="4" fill="none" stroke-linecap="round"/>`}[mouth];
  const eyes= mouth==='laugh'?`<path d="M33 45 q6 -6 12 0" stroke="#2a0b0b" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M55 45 q6 -6 12 0" stroke="#2a0b0b" stroke-width="4" fill="none" stroke-linecap="round"/>`
           : `<circle cx="39" cy="46" r="${mouth==='o'?6:4.5}" fill="#fff"/><circle cx="61" cy="46" r="${mouth==='o'?6:4.5}" fill="#fff"/><circle cx="39" cy="46" r="3" fill="#1b1b1b"/><circle cx="61" cy="46" r="3" fill="#1b1b1b"/>`;
  const brows= mouth==='o'?`<path d="M30 34 L46 38" stroke="#2a1a10" stroke-width="4" stroke-linecap="round"/><path d="M70 34 L54 38" stroke="#2a1a10" stroke-width="4" stroke-linecap="round"/>`:'';
  const hs=headset?`<path d="M18 50 Q18 8 50 8 Q82 8 82 50" stroke="#222" stroke-width="7" fill="none"/><rect x="10" y="40" width="14" height="24" rx="6" fill="${headset}"/><rect x="76" y="40" width="14" height="24" rx="6" fill="${headset}"/>`:'';
  return `<svg class="person" style="left:${x}px;top:${y}px" width="${s}" height="${s*1.35}" viewBox="0 0 100 135">
   <path d="M8 135 Q10 98 50 96 Q90 98 92 135Z" fill="${shirt}"/>
   <rect x="42" y="82" width="16" height="18" fill="${skin}"/>
   <ellipse cx="50" cy="52" rx="30" ry="36" fill="${skin}"/>
   <path d="M20 44 Q22 12 50 12 Q80 12 80 44 Q70 26 50 26 Q30 26 20 44Z" fill="${hair}"/>
   ${brows}${eyes}${m}${hs}</svg>`;
}
const T=[
 // REACTIONS
 ()=>`<div class="t" style="background:linear-gradient(135deg,#ffcf3f,#ff6a3d)">${person(150,40,180,'#f2c39b','#3b6cff','laugh','#3a2416',null)}<div class="emo" style="position:absolute;left:30px;top:30px;font-size:70px">😂</div><div class="emo" style="position:absolute;right:30px;top:140px;font-size:56px">😂</div></div>`,
 ()=>`<div class="t" style="background:radial-gradient(circle at 50% 40%,#7b5cff,#1d1450)">${person(160,30,170,'#8d5a3b','#ffd23f','o','#120b06',null)}<div class="big" style="left:24px;top:180px;font-size:54px">NO WAY</div><div class="emo" style="position:absolute;right:26px;top:26px;font-size:64px">🤯</div></div>`,
 ()=>`<div class="t" style="background:linear-gradient(160deg,#16c2a3,#0b4f6c)">${person(70,40,160,'#e8b48c','#ff3d6e','grin','#d9a23a',null)}${person(260,46,150,'#6b4430','#ffffff','laugh','#111',null)}<div class="emo" style="position:absolute;left:210px;top:16px;font-size:44px">💀</div></div>`,
 // GAMING
 ()=>`<div class="t" style="background:linear-gradient(180deg,#0e1a3a,#183a7a 55%,#c06a2a 56%,#5a2c10)">
   <div style="position:absolute;left:0;right:0;top:120px;height:30px;background:repeating-linear-gradient(90deg,#2a3f6e 0 60px,#22345c 60px 120px)"></div>
   <div style="position:absolute;left:228px;top:122px;width:24px;height:24px;border:3px solid #fff;border-radius:50%"></div>
   <div style="position:absolute;left:239px;top:108px;width:2px;height:52px;background:#fff"></div><div style="position:absolute;left:214px;top:133px;width:52px;height:2px;background:#fff"></div>
   <div class="big" style="left:120px;top:24px;color:#ffd54a">ACE!</div>
   <div class="chat" style="right:14px;top:14px;font-size:13px;text-align:right">YOU ▸ 💀 enemy1<br>YOU ▸ 💀 enemy2<br>YOU ▸ 💀 enemy3<br>YOU ▸ 💀 enemy4<br>YOU ▸ 💀 enemy5</div>
   <div style="position:absolute;right:-20px;bottom:-20px;width:230px;height:110px;background:linear-gradient(120deg,#333,#777 40%,#222);transform:rotate(-12deg);border-radius:10px"></div></div>`,
 ()=>`<div class="t" style="background:radial-gradient(ellipse at 50% 120%,#ff2fbf,#2a0a5a 60%,#090316)">
   <div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,255,255,.18) 0 2px,transparent 2px 40px),repeating-linear-gradient(0deg,rgba(0,255,255,.18) 0 2px,transparent 2px 40px);transform:perspective(300px) rotateX(60deg) translateY(80px) scale(1.8)"></div>
   <div class="big" style="left:52px;top:60px;font-size:58px;color:#fff;-webkit-text-stroke:2px #00f0ff">VICTORY</div>
   <div style="position:absolute;left:60px;top:140px;font:800 26px Inter;color:#00f0ff">#1 · 14 ELIMS</div></div>`,
 ()=>`<div class="t" style="background:linear-gradient(180deg,#5fc8ff,#a8e4ff 50%,#4caf50 51%,#2e7d32)">
   <div style="position:absolute;left:180px;top:70px;width:120px;height:120px;background:#8d6e63;border:6px solid #5d4037"></div>
   <div style="position:absolute;left:206px;top:96px;width:68px;height:68px;background:#2e7d32"></div>
   <div class="big" style="left:40px;top:20px;font-size:46px;color:#fff">1 IN A MILLION</div>
   <div class="emo" style="position:absolute;left:360px;top:150px;font-size:60px">💎</div></div>`,
 // STREAMER SCREAMING
 ()=>`<div class="t" style="background:linear-gradient(135deg,#ff2d55,#5b0eeb)">
   <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)"></div>
   ${person(140,16,200,'#f0c19a','#111','o','#e8432f','#ff2d55')}
   <div class="chat" style="left:14px;top:150px">LMAOOO<br>HE'S SO LOUD 💀<br>clip it clip it</div>
   <div style="position:absolute;right:12px;top:12px;background:#f13549;color:#fff;font:900 16px Inter;padding:4px 10px;border-radius:6px">LIVE</div></div>`,
 ()=>`<div class="t" style="background:#120a1c">
   <div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 50%,rgba(0,255,170,.55),transparent 55%),radial-gradient(circle at 80% 30%,rgba(255,0,170,.5),transparent 55%)"></div>
   ${person(170,20,190,'#7a4a2e','#00d27a','o','#1a1a1a','#00ffb3')}
   <div class="emo" style="position:absolute;left:24px;top:24px;font-size:52px">😱</div>
   <div style="position:absolute;right:12px;top:12px;background:#f13549;color:#fff;font:900 16px Inter;padding:4px 10px;border-radius:6px">LIVE</div></div>`,
 ()=>`<div class="t" style="background:linear-gradient(180deg,#1b2a4a,#0b1020)">
   <div style="position:absolute;left:0;top:0;width:300px;height:270px;background:linear-gradient(135deg,#2b5876,#4e4376)"></div>
   <div class="big" style="left:24px;top:96px;font-size:44px;color:#ffeb3b">WHAT?!</div>
   <div class="cam" style="left:280px;top:60px;width:180px;height:150px;background:#2a2238">${person(26,6,130,'#f3c6a5','#ff6f00','o','#3e2723','#ffffff')}</div></div>`,
 // CROWD GOING WILD
 ()=>`<div class="t" style="background:radial-gradient(ellipse at 50% 0%,#ffe08a,#ff5e3a 30%,#3a0d2e 70%,#12040f)">${crowd('#12040f',1)}<div style="position:absolute;left:50px;top:-40px;width:60px;height:260px;background:linear-gradient(rgba(255,255,255,.7),transparent);transform:rotate(18deg);filter:blur(6px)"></div><div style="position:absolute;right:60px;top:-40px;width:60px;height:260px;background:linear-gradient(rgba(140,220,255,.7),transparent);transform:rotate(-20deg);filter:blur(6px)"></div></div>`,
 ()=>`<div class="t" style="background:linear-gradient(180deg,#0a2a6a,#1565c0 40%,#0a0a1a)">${crowd('#05060f',2)}<div class="emo" style="position:absolute;left:200px;top:18px;font-size:56px">🏆</div>${confetti(3)}</div>`,
 ()=>`<div class="t" style="background:radial-gradient(ellipse at 50% 20%,#a6ff00,#1b5e20 45%,#04140a)">${crowd('#020a05',3)}<div class="big" style="left:120px;top:22px;font-size:58px">GOAL!!</div>${confetti(5)}</div>`,
];
function crowd(col,seed){let s=seed*9301,r=()=>{s=(s*9301+49297)%233280;return s/233280},h='';
  for(let i=0;i<22;i++){const x=i*23-10+r()*10,y=150+r()*40,sz=40+r()*24,arm=r()<.6;
    h+=`<svg style="position:absolute;left:${x}px;top:${y}px" width="${sz}" height="${sz*2}" viewBox="0 0 40 80"><circle cx="20" cy="18" r="10" fill="${col}"/><path d="M4 80 Q4 32 20 32 Q36 32 36 80Z" fill="${col}"/>${arm?`<path d="M8 40 L0 2" stroke="${col}" stroke-width="7" stroke-linecap="round"/><path d="M32 40 L40 4" stroke="${col}" stroke-width="7" stroke-linecap="round"/>`:''}</svg>`;}
  return h;}
function confetti(seed){let s=seed*7919,r=()=>{s=(s*9301+49297)%233280;return s/233280},h='';const C=['#f13549','#ffd54a','#35c8e8','#c4e830','#fff'];
  for(let i=0;i<40;i++)h+=`<div style="position:absolute;left:${r()*480}px;top:${r()*200}px;width:8px;height:14px;background:${C[i%5]};transform:rotate(${r()*180}deg)"></div>`;return h;}
document.getElementById('root').innerHTML=T.map((f,i)=>`<div id="t${i}">${f()}</div>`).join('');
window.N=T.length;
</script></body></html>
